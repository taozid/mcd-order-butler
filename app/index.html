<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麦麦专属点单管家 · 规则编辑器</title>
<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#16202e; --muted:#6b7a90; --line:#e3e9f1;
  --accent:#2f6feb; --accent-soft:#eef3fd; --ok:#0f9d58; --warn:#c0392b;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 40px}

header.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;
}
header.top h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:650}
header.top .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],textarea{
  font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;min-height:36px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{
  font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:7px 12px;min-height:36px;transition:.15s;
}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#2560d4;color:#fff}
button.ghost{border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--warn);border-color:var(--line)}
button.mini{padding:4px 9px;min-height:30px;font-size:12.5px}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media (max-width:940px){ .grid{grid-template-columns:1fr} }

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel > .hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;
}
.panel > .hd h2{margin:0;font-size:14px;font-weight:650}
.panel > .bd{padding:14px}

/* 分层图例 */
.ladder{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.ladder .lv{
  display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;
  background:#fbfcfe;border:1px solid var(--line);font-size:12.5px;
}
.ladder .lv .rank{
  font-variant-numeric:tabular-nums;font-size:11px;color:#fff;border-radius:5px;
  padding:1px 6px;min-width:30px;text-align:center;font-weight:600;
}
.ladder .lv .nm{font-weight:600}
.ladder .lv .ds{color:var(--muted);font-size:11.5px}

/* 规则卡 */
.tiergroup{margin-top:14px}
.tiergroup .tg-hd{
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;
  color:var(--muted);margin-bottom:8px;letter-spacing:.3px;
}
.tiergroup .tg-hd .bar{width:3px;height:13px;border-radius:2px}
.rule{
  display:flex;gap:10px;align-items:flex-start;padding:10px 11px;margin-bottom:8px;
  border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;background:#fff;
}
.rule.off{opacity:.5}
.rule .ic{
  flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;
}
.rule .main{flex:1;min-width:0}
.rule .ttl{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rule .ttl .chip{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:500}
.rule .note{color:var(--muted);font-size:12px;margin-top:2px}
.rule .pv{font-size:12px;margin-top:5px;color:#334155;background:#f7f9fc;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;word-break:break-all}
.rule .pv b{font-weight:600;color:var(--muted);font-size:11px}
.rule .acts{display:flex;gap:5px;flex:none}

.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 0}

/* 表单 */
.form{border:1px solid var(--accent);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--accent-soft)}
.form .row{margin-bottom:9px}
.form label{display:block;font-size:12px;color:#334155;margin-bottom:4px;font-weight:600}
.form .hint{font-size:11.5px;color:var(--muted);margin:-2px 0 8px}
.form input[type=text],.form input[type=number],.form select{width:100%}
.checks{display:flex;gap:7px;flex-wrap:wrap}
.checks label{
  display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:12px;
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;min-height:34px;
}
.checks label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.form .btns{display:flex;gap:8px;margin-top:12px}

/* 结果 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:12px}
.metric{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fbfcfe;text-align:center}
.metric .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.metric .k{font-size:11px;color:var(--muted);margin-top:1px}

.opt{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:11px;background:#fff}
.opt:first-of-type{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .oh{font-weight:650;font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .oh .idx{flex:none;background:var(--accent);color:#fff;border-radius:5px;font-size:11px;padding:1px 7px;font-weight:700}
.opt:not(:first-of-type) .oh .idx{background:#94a3b8}
.opt .om{font-size:12px;color:var(--muted);margin:3px 0 8px;font-variant-numeric:tabular-nums}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:9px;background:#fff}
.pick .nm{font-weight:650;font-size:14px}
.pick .optag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:500}
.pick .why{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.trace{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#334155}
.trace .tag{
  flex:none;font-size:10.5px;border-radius:5px;padding:1px 6px;color:#fff;font-weight:600;
}
.trace .tag.plus{background:#12a06a} .trace .tag.minus{background:#c0392b}
.trace.plain .tag{background:#94a3b8}

.rej{border:1px solid var(--line);border-left:3px solid #c0392b;border-radius:8px;padding:8px 10px;margin-bottom:7px;background:#fff}
.rej .nm{font-weight:600;font-size:13px}
.rej .rs{font-size:12px;color:#7f1d1d;margin-top:2px}
.rej .sup{font-size:11.5px;color:var(--muted);margin-top:3px}
.rej .sup b{color:#b45309}

.note-box{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fffaf3;color:#8a5a12;font-size:12.5px}
.note-box.ok{background:#f2fbf6;color:#146c43;border-color:#cdeadb}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kv span{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#fbfcfe}
.foot{color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.7}
details.raw{margin-top:10px}
details.raw textarea{width:100%;min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>麦麦专属点单管家</h1>
    <div class="sub">个性化规则驱动的麦当劳点单决策引擎 · 规则可增删改，冲突按分层优先级仲裁，每条决策都可解释</div>
  </div>
  <div class="ctrl">
    <select id="slot" title="餐次">
      <option value="breakfast">早餐</option>
      <option value="lunch" selected>午餐</option>
      <option value="dinner">晚餐</option>
      <option value="latenight">夜宵</option>
    </select>
    <select id="group" title="人群">
      <option value="adult" selected>成人</option>
      <option value="child">儿童</option>
      <option value="elder">老人</option>
      <option value="pregnant">孕期</option>
    </select>
    <button class="primary" id="run">生成推荐</button>
  </div>
</header>

<div class="grid">

  <!-- 左：规则 -->
  <section class="panel">
    <div class="hd">
      <h2>我的规则</h2>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="newType" style="min-height:34px;padding:5px 9px"></select>
        <button class="primary mini" id="add">＋ 新增</button>
      </div>
    </div>
    <div class="bd">
      <div class="ladder" id="ladder"></div>
      <div id="rules"></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="mini" id="exp">导出 JSON</button>
        <button class="mini" id="imp">导入 JSON</button>
        <button class="mini" id="demo">载入示例</button>
        <button class="mini ghost" id="clr">清空</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
      <details class="raw"><summary style="font-size:12px;color:var(--muted);cursor:pointer">查看 / 编辑原始 JSON</summary>
        <textarea id="raw" spellcheck="false"></textarea>
        <button class="mini" id="applyRaw" style="margin-top:6px">应用这份 JSON</button>
      </details>
      <div class="foot">
        规则存在你本机浏览器（localStorage），不上传任何服务器。<br>
        改完点「生成推荐」即时看到结果。
      </div>
    </div>
  </section>

  <!-- 右：结果 -->
  <section class="panel">
    <div class="hd"><h2>推荐结果</h2><span id="ctxTag" style="font-size:11.5px;color:var(--muted)"></span></div>
    <div class="bd" id="out">
      <div class="empty">点右上角「生成推荐」</div>
    </div>
  </section>

</div>
</div>

<script>
/* ==== ORDER-BUTLER:BEGIN ==== */
/**
 * 麦麦专属点单管家 · 规则引擎
 *
 * 设计契约（新增规则类型时不需要修改本文件）：
 *   1. 引擎只理解三种 kind：item（对单品裁决）/ bundle（对整餐裁决）/ config（生成订单配置项）
 *   2. 规则类型是一份"数据描述符"，声明 tier、when（怎么判定）、effect（裁决什么）
 *   3. 冲突仲裁由 tier 决定，高 tier 覆盖低 tier，冲突被显式记录进 trace
 *
 * UMD：浏览器挂到 window.McdButler，Node 走 module.exports
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.McdButler = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 1. 分层优先级（tier ladder）
   *    rank 越大越优先。同 tier 内按 rule.order（用户可覆盖）降序。
   * ------------------------------------------------------------------ */
  const TIERS = [
    { id: 'safety',     rank: 100, label: '安全 · 禁忌',   desc: '过敏、宗教戒律、硬禁忌 —— 一票否决，不可被低层规则推翻' },
    { id: 'health',     rank: 80,  label: '健康目标',       desc: '热量预算、控盐控糖、增肌高蛋白 —— 强约束' },
    { id: 'person',     rank: 60,  label: '人群差异',       desc: '儿童 / 老人 / 成人 / 孕期 —— 人群专属约束与营养加权' },
    { id: 'meal-slot',  rank: 45,  label: '餐次菜单',       desc: '早餐 / 午餐 / 晚餐 / 夜宵各自的可售品类与份量逻辑' },
    { id: 'preference', rank: 30,  label: '口味偏好',       desc: '喜欢 / 不喜欢 / 收藏 / 换口味 —— 只影响排序，不否决' },
    { id: 'custom',     rank: 15,  label: '定制指令',       desc: '去酱去冰、不要小食、取餐方式 —— 改配置项，不改选品结果' },
    { id: 'value',      rank: 5,   label: '优惠 · 性价比',  desc: '预算上限、优先用券、性价比 —— 最后一道加权' }
  ];

  const TIER_RANK = TIERS.reduce((m, t) => (m[t.id] = t.rank, m), {});

  /* ------------------------------------------------------------------ *
   * 2. 规则类型目录（纯数据 —— 新增类型 = 往这里加一条，引擎不改）
   * ------------------------------------------------------------------ */
  const RULE_TYPES = [
    /* ---------------- safety ---------------- */
    {
      typeId: 'diet.avoid-ingredient', label: '饮食禁忌 · 禁用食材/品类', tier: 'safety',
      kind: 'item', effect: 'veto', icon: '禁',
      hint: '命中关键词的单品直接排除，优先级最高，任何"喜欢"都救不回来。',
      when: { field: 'searchText', op: 'containsAny', valueKey: 'keywords' },
      reason: '含禁用项「{hit}」',
      paramsSchema: [
        { key: 'keywords', label: '禁用关键词', type: 'tags', placeholder: '牛肉 / 香菜 / 花生 …' }
      ]
    },
    {
      typeId: 'diet.allergen', label: '过敏原', tier: 'safety',
      kind: 'item', effect: 'veto', icon: '敏',
      hint: '比普通禁忌更严格：同时匹配过敏原字段与配料表。',
      when: { field: 'allergenText', op: 'containsAny', valueKey: 'allergens' },
      reason: '含过敏原「{hit}」',
      paramsSchema: [
        { key: 'allergens', label: '过敏原', type: 'tags', placeholder: '花生 / 芒果 / 小麦 …' }
      ]
    },
    {
      typeId: 'diet.spice-cap', label: '辣度上限', tier: 'safety',
      kind: 'item', effect: 'veto', icon: '辣',
      hint: '0=不辣 1=微辣 2=中辣 3=特辣。超过设定值的单品排除。',
      when: { metric: 'spiceLevel', op: 'gt', valueKey: 'maxLevel' },
      reason: '辣度 {itemValue} 超过上限 {target}',
      paramsSchema: [
        { key: 'maxLevel', label: '最高辣度', type: 'select', default: 1,
          options: [{ value: 0, label: '不辣' }, { value: 1, label: '微辣' }, { value: 2, label: '中辣' }, { value: 3, label: '特辣' }] }
      ]
    },
    {
      typeId: 'diet.religious', label: '宗教 / 戒律', tier: 'safety',
      kind: 'item', effect: 'veto', icon: '戒',
      hint: '内置清真、素食、无猪、无牛四套关键词，选择即生效。',
      when: { field: 'searchText', op: 'containsAny', valueKey: 'mode' },
      presets: {
        halal:      ['猪肉', '猪', '火腿', '培根', '香肠', '猪油', '酒精', '酒'],
        vegetarian: ['牛肉', '猪肉', '鸡肉', '鸡', '鱼', '虾', '海鲜', '肉'],
        'no-pork':    ['猪肉', '猪', '火腿', '培根', '猪油'],
        'no-beef':    ['牛肉', '牛']
      },
      reason: '{modeLabel}忌「{hit}」',
      paramsSchema: [
        { key: 'mode', label: '戒律', type: 'select', default: 'halal',
          options: [{ value: 'halal', label: '清真' }, { value: 'vegetarian', label: '素食' }, { value: 'no-pork', label: '不吃猪肉' }, { value: 'no-beef', label: '不吃牛肉' }] }
      ]
    },
    {
      typeId: 'diet.sodium-item-cap', label: '单品钠上限', tier: 'safety',
      kind: 'item', effect: 'veto', icon: '钠',
      hint: '单个餐品的钠含量硬上限（mg）。整餐控钠请用「健康目标 · 控盐」。',
      when: { metric: 'sodium', op: 'gt', valueKey: 'maxMg' },
      reason: '单品钠 {itemValue}mg 超过 {target}mg',
      paramsSchema: [{ key: 'maxMg', label: '上限 (mg)', type: 'number', default: 800, unit: 'mg' }]
    },

    /* ---------------- health ---------------- */
    {
      typeId: 'health.calorie-budget', label: '健康目标 · 热量预算', tier: 'health',
      kind: 'bundle', effect: 'veto', icon: '卡',
      hint: '整餐总热量上限。超预算的组合会被整体否决，引擎自动换更低卡的搭配。',
      when: { metric: 'calories', op: 'gt', valueKey: 'budget' },
      reason: '整餐 {itemValue}kcal 超出预算 {target}kcal',
      paramsSchema: [{ key: 'budget', label: '每餐热量预算', type: 'number', default: 600, unit: 'kcal' }]
    },
    {
      typeId: 'health.protein-target', label: '健康目标 · 增肌高蛋白', tier: 'health',
      kind: 'bundle', effect: 'veto', icon: '蛋',
      hint: '整餐蛋白质下限（g），达不到则换搭配，用于增肌人群。',
      when: { metric: 'protein', op: 'lt', valueKey: 'minGram' },
      reason: '整餐蛋白 {itemValue}g 未达 {target}g',
      paramsSchema: [{ key: 'minGram', label: '最低蛋白', type: 'number', default: 30, unit: 'g' }]
    },
    {
      typeId: 'health.sodium-cap', label: '健康目标 · 控盐', tier: 'health',
      kind: 'bundle', effect: 'veto', icon: '盐',
      hint: '整餐钠总量上限（mg）。',
      when: { metric: 'sodium', op: 'gt', valueKey: 'maxMg' },
      reason: '整餐钠 {itemValue}mg 超出 {target}mg',
      paramsSchema: [{ key: 'maxMg', label: '整餐钠上限', type: 'number', default: 1500, unit: 'mg' }]
    },
    {
      typeId: 'health.sugar-cap', label: '健康目标 · 控糖', tier: 'health',
      kind: 'bundle', effect: 'veto', icon: '糖',
      hint: '整餐糖分上限（g）。含糖饮料是最常见的超标来源。',
      when: { metric: 'sugar', op: 'gt', valueKey: 'maxGram' },
      reason: '整餐糖 {itemValue}g 超出 {target}g',
      paramsSchema: [{ key: 'maxGram', label: '整餐糖上限', type: 'number', default: 30, unit: 'g' }]
    },
    {
      typeId: 'health.fat-cap', label: '健康目标 · 控脂', tier: 'health',
      kind: 'bundle', effect: 'veto', icon: '脂',
      hint: '整餐脂肪上限（g）。',
      when: { metric: 'fat', op: 'gt', valueKey: 'maxGram' },
      reason: '整餐脂肪 {itemValue}g 超出 {target}g',
      paramsSchema: [{ key: 'maxGram', label: '整餐脂肪上限', type: 'number', default: 35, unit: 'g' }]
    },

    /* ---------------- person ---------------- */
    {
      typeId: 'person.group-veto', label: '人群差异 · 人群禁忌', tier: 'person',
      kind: 'item', effect: 'veto', icon: '群',
      hint: '按人群套用内置禁忌清单：儿童避开酒精/咖啡因/整骨/刺激性；老人避开硬/冰/高钠。',
      when: { field: 'searchText', op: 'containsAny', valueKey: 'group' },
      presets: {
        child:  ['酒精', '酒', '咖啡', '咖啡因', '可乐', '整骨', '骨', '特辣', '超辣', '芥末'],
        elder:  ['冰', '冰块', '整骨', '骨', '硬', '坚果', '特辣', '酒'],
        adult:  [],
        pregnant: ['酒精', '酒', '咖啡因', '生', '半熟', '溏心']
      },
      reason: '{groupLabel}不宜「{hit}」',
      paramsSchema: [
        { key: 'group', label: '人群', type: 'select', default: 'child',
          options: [{ value: 'child', label: '儿童' }, { value: 'elder', label: '老人' }, { value: 'adult', label: '成人' }, { value: 'pregnant', label: '孕期' }] }
      ]
    },
    {
      typeId: 'person.nutrition-bonus', label: '人群差异 · 营养加权', tier: 'person',

        { key: 'basis', label: '衡量口径', type: 'select', default: 'protein',
          options: [{ value: 'protein', label: '每元蛋白质' }, { value: 'calories', label: '每元热量' }] },
        { key: 'minDensity', label: '达标线', type: 'number', default: 1.2 }
      ]
    }
  ];

  const RULE_TYPE_MAP = RULE_TYPES.reduce((m, t) => (m[t.typeId] = t, m), {});

  /* ------------------------------------------------------------------ *
   * 3. 工具
   * ------------------------------------------------------------------ */
  const MEAL_SLOT_LABEL = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', latenight: '夜宵' };
  const GROUP_LABEL = { child: '儿童', elder: '老人', adult: '成人', pregnant: '孕期' };
  // 品类 → 组合角色。可被 ctx.roles 覆盖，因此新增"汤品""儿童餐"等品类无需改引擎
  const DEFAULT_ROLES = { primary: ['主食', '早餐'], side: ['小食'], drink: ['饮料'], dessert: ['甜品'] };
  const UNIT_BY_METRIC = { calories: 'kcal', protein: 'g', sodium: 'mg', sugar: 'g', fat: 'g', price: '元', couponValue: '元' };
  // 各角色的"标准份"参考热量。没有任何规则命中时用它排序，避免默认堆成最大份
  const REF_CALORIES = { primary: 450, side: 250, drink: 120, dessert: 200 };
  function refCalories(item, roles) {
    for (const k in roles) if (roles[k].indexOf(item.category) >= 0) return REF_CALORIES[k] || 300;
    return 300;
  }

  function normalizeItem(raw) {
    const tags = raw.tags || [];
    const ingredients = raw.ingredients || [];
    const allergens = raw.allergens || [];
    return Object.assign({}, raw, {
      calories: num(raw.calories), protein: num(raw.protein), sodium: num(raw.sodium),
      sugar: num(raw.sugar), fat: num(raw.fat), price: num(raw.price),
      spiceLevel: num(raw.spiceLevel),
      valueDensity: raw.price > 0 ? num(raw.protein) / raw.price : 0,
      searchText: [raw.name, raw.category, tags.join(' '), ingredients.join(' ')].join(' ').toLowerCase(),
      allergenText: [allergens.join(' '), ingredients.join(' ')].join(' ').toLowerCase()
    });
  }
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }

  /** 规则的作用域是否覆盖当前上下文 */
  function inScope(rule, ctx) {
    const s = rule.scope || {};
    const hit = (arr, v) => !arr || !arr.length || arr.indexOf('*') >= 0 || arr.indexOf(v) >= 0;
    return hit(s.mealSlots, ctx.mealSlot) && hit(s.personGroups, ctx.personGroup);
  }

  /** 取出 when 要比较的实际值数组 */
  function resolveValues(type, when, params) {
    const key = when.valueKey;
    if (type.presets && params[key] && type.presets[params[key]]) return type.presets[params[key]];
    const v = params[key];
    return Array.isArray(v) ? v : (v == null ? [] : [v]);
  }

  function itemFieldValue(item, field) {
    if (field === 'searchText') return item.searchText;
    if (field === 'allergenText') return item.allergenText;
    if (field === 'code') return String(item.code || '');
    return String(item[field] == null ? '' : item[field]).toLowerCase();
  }

  function fillTemplate(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, (_, k) => (vars[k] == null ? '' : vars[k]));
  }

  /* ------------------------------------------------------------------ *
   * 4. 单品裁决
   * ------------------------------------------------------------------ */
  function evaluateItemRule(type, rule, item, ctx) {
    const when = type.when;
    const params = rule.params || {};

    // bundle / config 类型不参与单品裁决
    if (type.kind !== 'item') return null;

    // 品类排除类：由调用方用 excludeCategories 处理，这里跳过
    if (when.metric) {
      const iv = item[when.metric] || 0;
      const a = num(params[when.valueKey]);
      const b = num(params[when.valueKey2]);
      let ok = false;
      switch (when.op) {
        case 'gt': ok = iv > a; break;
        case 'lt': ok = iv < a; break;
        case 'gte': ok = iv >= a; break;
        case 'lte': ok = iv <= a; break;
        case 'between': ok = iv >= a && iv <= b; break;
      }
      if (type.effect === 'bonus' || type.effect === 'penalty') { if (!ok) return null; }
      else if (!ok) return null; // veto 未命中即放行
      const isVeto = type.effect === 'veto';
      return {
        ruleId: rule.id, typeId: type.typeId, label: type.label, tier: type.tier,
        effect: isVeto ? 'veto' : type.effect,
        weight: type.effect === 'veto' ? 0 : signedWeight(type),
        reason: fillTemplate(type.reason, {
          itemValue: Math.round(iv * 10) / 10, target: a,
          unit: params.basis === 'calories' ? 'kcal' : 'g'
        })
      };
    }

    if (when.requireKeywords) return null;

    const values = resolveValues(type, when, params).map(v => String(v).toLowerCase());
    if (!values.length) return null;
    const fieldVal = itemFieldValue(item, when.field);
    const hit = values.find(v => fieldVal.indexOf(v) >= 0);

    if (when.op === 'notIn') {
      // 允许清单：命中即放行，未命中则否决
      const inList = values.indexOf(itemFieldValue(item, when.field)) >= 0;
      if (inList) return null;
      return {
        ruleId: rule.id, typeId: type.typeId, label: type.label, tier: type.tier, effect: 'veto', weight: 0,
        reason: fillTemplate(type.reason, {
          itemValue: item.category, mealSlotLabel: MEAL_SLOT_LABEL[ctx.mealSlot] || ctx.mealSlot
        })
      };
    }

    if (!hit) return null;
    if (type.effect === 'veto') {
      return {
        ruleId: rule.id, typeId: type.typeId, label: type.label, tier: type.tier, effect: 'veto', weight: 0,
        reason: fillTemplate(type.reason, {
          hit: hit, itemValue: item[when.field] || hit,
          modeLabel: (type.presets && modeLabel(type, params)) || '',
          groupLabel: GROUP_LABEL[params.group] || '',
          mealSlotLabel: MEAL_SLOT_LABEL[ctx.mealSlot] || ctx.mealSlot
        })
      };
    }
    return {
      ruleId: rule.id, typeId: type.typeId, label: type.label, tier: type.tier,
      effect: type.effect, weight: signedWeight(type),
      reason: fillTemplate(type.reason, {
        hit: hit, itemValue: item[when.field] || hit,
        groupLabel: GROUP_LABEL[params.group] || '',
        mealSlotLabel: MEAL_SLOT_LABEL[ctx.mealSlot] || ctx.mealSlot
      })
    };
  }

  function modeLabel(type, params) {
    const key = type.when.valueKey;
    const opt = (type.paramsSchema.find(p => p.key === key) || {}).options || [];
    const found = opt.find(o => String(o.value) === String(params[key]));
    return found ? found.label : params[key];
  }
  function signedWeight(type) {
    const w = type.weight == null ? 10 : type.weight;
    return type.effect === 'penalty' ? -w : w;
  }

  /* ------------------------------------------------------------------ *
   * 5. 主流程
   * ------------------------------------------------------------------ */
  function recommend(input) {
    const profile = input.profile || {};
    const ctx = Object.assign({ mealSlot: 'lunch', personGroup: 'adult', history: [], coupons: [] }, input.ctx || {});
    const menu = (input.menu || []).map(normalizeItem);
    const rules = (profile.rules || []).filter(r => r && r.enabled !== false && inScope(r, ctx));

    // 规则排序：tier 降序 → 用户 order 降序 → 声明顺序
    const ordered = rules.slice().map((r, i) => ({ r, i })).sort((a, b) => {
      const ta = TIER_RANK[(RULE_TYPE_MAP[a.r.type] || {}).tier] || 0;
      const tb = TIER_RANK[(RULE_TYPE_MAP[b.r.type] || {}).tier] || 0;
      if (ta !== tb) return tb - ta;
      const oa = a.r.order || 0, ob = b.r.order || 0;
      if (oa !== ob) return ob - oa;
      return a.i - b.i;
    }).map(x => x.r);

    const excludeCategories = collectExcludeCategories(ordered, ctx);

    /* --- 5.1 单品裁决 --- */
    const candidates = [];
    const rejected = [];
    for (const item of menu) {
      if (ctx.mealSlot && item.slots && item.slots.length && item.slots.indexOf(ctx.mealSlot) < 0) continue;
      if (excludeCategories.indexOf(item.category) >= 0) {
        rejected.push({ item, tier: 'custom', reason: '整餐不要「' + item.category + '」', ruleId: null });
        continue;
      }

      const trace = [];
      const suppressed = [];
      let vetoed = null;
      let score = 0;
      for (const rule of ordered) {
        const type = RULE_TYPE_MAP[rule.type];
        if (!type || type.kind !== 'item') continue;
        const d = evaluateItemRule(type, rule, item, ctx);
        if (!d) continue;
        if (d.effect === 'veto') {
          // ordered 已按 tier 降序，第一个否决即最高层裁决，后面更低的否决不再覆盖
          if (!vetoed) vetoed = d;
          continue;
        }
        // 已被否决：继续收集低层意见，用于输出"这条偏好被哪条硬规则压掉了"
        // 只记正向加分 —— 压掉一条"不喜欢"（减分）不构成冲突，写出来反而误导
        if (vetoed) {
          if (d.effect === 'bonus' && TIER_RANK[d.tier] < TIER_RANK[vetoed.tier]) suppressed.push(d);
          continue;
        }
        trace.push(d);
        score += d.weight;
      }

      if (vetoed) { rejected.push({ item, tier: vetoed.tier, reason: vetoed.reason, ruleId: vetoed.ruleId, suppressed: suppressed }); continue; }
      candidates.push({ item, score, trace });
    }

    /* --- 5.2 组合裁决（枚举有界搜索） --- */
    // 品类角色由 ctx.roles 覆盖，不在引擎里写死具体品类名
    const roles = Object.assign({}, DEFAULT_ROLES, ctx.roles || {});

    // 平局时按"离标准份多近"排序：没有偏好时给一份中规中矩的，而不是蛋白最大化堆成大份
    candidates.sort((a, b) => b.score - a.score
      || Math.abs(a.item.calories - refCalories(a.item, roles)) - Math.abs(b.item.calories - refCalories(b.item, roles))
      || a.item.price - b.item.price);

    const topOf = (list, n) => candidates.filter(c => list.indexOf(c.item.category) >= 0).slice(0, n);
    const mains = topOf(roles.primary, 6);
    const sides = topOf(roles.side, 4).concat([null]);
    const drinks = topOf(roles.drink, 4).concat([null]);
    // 甜品不默认塞进组合：只有规则明确给它加分、或调用方显式允许时才出现
    const dessertCands = topOf(roles.dessert, 3);
    const dessertWanted = ctx.allowDessert === true || dessertCands.some(c => c.score > 0);
    const desserts = dessertWanted ? dessertCands.concat([null]) : [null];

    const bundleRules = ordered.filter(r => (RULE_TYPE_MAP[r.type] || {}).kind === 'bundle');
    const passing = [];
    for (const m of mains) for (const s of sides) for (const d of drinks) for (const t of desserts) {
      const picks = [m, s, d, t].filter(Boolean);
      const metrics = sumMetrics(picks, ctx);
      const check = checkBundle(bundleRules, metrics, picks, ctx);
      if (!check.ok) continue;
      const total = picks.reduce((acc, p) => acc + p.score, 0) + check.bonus;
      passing.push({ picks, metrics, bonus: check.bonus, total, bundleTrace: check.trace });
    }
    passing.sort((a, b) => b.total - a.total);

    // 给用户"几个选项"而不是唯一答案：同一主食只出一次，凑不够再用其余组合补齐
    const topN = Math.max(1, input.topN || 1);
    const options = [];
    const seenMain = Object.create(null);
    const mainOf = ps => {
      const p = ps.find(x => roles.primary.indexOf(x.item.category) >= 0);
      return p ? p.item : null;
    };
    for (const c of passing) {
      const mi = mainOf(c.picks);
      const k = mi ? (mi.code || mi.name) : '';
      if (k && seenMain[k]) continue;
      if (k) seenMain[k] = 1;
      options.push(c);
      if (options.length >= topN) break;
    }
    if (options.length < topN) {
      for (const c of passing) {
        if (options.indexOf(c) < 0) options.push(c);
        if (options.length >= topN) break;
      }
    }
    const best = options[0] || null;

    /* --- 5.3 配置项 --- */
    const config = collectConfig(ordered, ctx);

    /* --- 5.4 结果 --- */
    if (!best) {
      // 没有任何组合通过硬约束：退化为"最接近"的单品，并说明卡在哪
      const why = mains.length
        ? explainFailure(bundleRules, sumMetrics([mains[0]], ctx), [mains[0]], ctx)
        : '当前餐次没有可选的' + roles.primary.join('、') + '（可能被餐次菜单规则或禁忌全部排除了）';
      return {
        ok: false, reason: why, ctx,
        picks: [], rejected: rejected.slice(0, 40), candidates: candidates.slice(0, 20),
        config, trace: [], metrics: null
      };
    }

    // 把 itemOptions 落到具体单品
    const finalize = o => {
      const picks = o.picks.map(p => ({
        item: p.item, score: p.score, trace: p.trace,
        options: resolveItemOptions(config.itemOptions, p.item)
      }));
      return {
        picks, metrics: o.metrics, score: o.total, bundleTrace: o.bundleTrace,
        summary: summarize(picks, o.metrics, config, ctx)
      };
    };
    const optionsOut = options.map(finalize);

    return {
      ok: true, ctx,
      options: optionsOut,              // 供用户挑的几个候选（主食互不重复）
      picks: optionsOut[0].picks,       // 兼容旧调用方：默认取最优
      metrics: optionsOut[0].metrics,
      bundleBonus: best.bonus,
      bundleTrace: best.bundleTrace,
      config: { orderOptions: config.orderOptions, excludeCategories },
      rejected: rejected.slice(0, 40),
      candidates: candidates.slice(0, 20),
      summary: optionsOut[0].summary
    };
  }

  function sumMetrics(picks, ctx) {
    const m = { calories: 0, protein: 0, sodium: 0, sugar: 0, fat: 0, price: 0, couponValue: 0, categories: {}, text: '' };
    const texts = [];
    for (const p of picks) {
      const it = p.item;
      m.calories += it.calories; m.protein += it.protein; m.sodium += it.sodium;
      m.sugar += it.sugar; m.fat += it.fat; m.price += it.price;
      m.categories[it.category] = (m.categories[it.category] || 0) + 1;
      texts.push(it.name + ' ' + (it.tags || []).join(' ') + ' ' + it.category);
    }
    m.text = texts.join(' ').toLowerCase();
    m.price = Math.round(m.price * 100) / 100;
    // 券：取该组合能吃到的最大面额（真实场景由 MCP query-store-coupons + calculate-price 决定）
    for (const c of (ctx.coupons || [])) {
      if (!c.minSpend || m.price >= c.minSpend) m.couponValue = Math.max(m.couponValue, num(c.value));
    }
    return m;
  }

  function checkBundle(bundleRules, metrics, picks, ctx) {
    const trace = [];
    let bonus = 0;
    let ok = true;
    for (const rule of bundleRules) {
      const type = RULE_TYPE_MAP[rule.type];
      if (!type) continue;
      const params = rule.params || {};
      if (type.effect === 'require' && type.when.requireKeywords) {
        const need = (params[type.when.valueKey] || []);
        const missing = need.filter(n => metrics.text.indexOf(String(n).toLowerCase()) < 0);
        if (missing.length) { ok = false; trace.push({ ruleId: rule.id, label: type.label, tier: type.tier, effect: 'require', reason: fillTemplate(type.reason, { missing: missing.join('、') }) }); break; }
        trace.push({ ruleId: rule.id, label: type.label, tier: type.tier, effect: 'pass', reason: '已包含 ' + need.join('、') });
        continue;
      }
      const iv = metrics[type.when.metric] || 0;
      const a = num(params[type.when.valueKey]);
      const fail = (type.when.op === 'gt' && iv > a) || (type.when.op === 'lt' && iv < a);
      if (type.effect === 'veto' && fail) {
        ok = false;
        trace.push({ ruleId: rule.id, label: type.label, tier: type.tier, effect: 'veto', reason: fillTemplate(type.reason, { itemValue: Math.round(iv * 10) / 10, target: a }) });
        break;
      }
      if (type.effect === 'bonus' && !fail) { bonus += type.weight || 10; }
      // 通过项不能复用失败措辞（会出现"380kcal 超出预算 480kcal"却标着[通过]），单独生成
      const u = UNIT_BY_METRIC[type.when.metric] || type.unit || '';
      const word = type.when.op === 'gt' ? '上限' : '下限';
      const sign = type.when.op === 'gt' ? '≤' : '≥';
      trace.push({ ruleId: rule.id, label: type.label, tier: type.tier, effect: 'pass',
        reason: `实际 ${Math.round(iv * 10) / 10}${u} ${sign} ${word} ${a}${u}` });
    }
    return { ok, bonus, trace };
  }

  function explainFailure(bundleRules, metrics, picks, ctx) {
    const c = checkBundle(bundleRules, metrics, picks, ctx);
    const v = c.trace.find(t => t.effect === 'veto' || t.effect === 'require');
    return v ? '没有组合能同时满足你的硬约束：' + v.reason : '没有满足全部硬约束的组合';
  }

  function collectExcludeCategories(rules, ctx) {
    const out = [];
    for (const r of rules) {
      const t = RULE_TYPE_MAP[r.type];
      if (t && t.configTarget === 'excludeCategories') out.push.apply(out, (r.params || {}).categories || []);
    }
    return out;
  }

  function collectConfig(rules, ctx) {
    const itemOptions = [], orderOptions = {};
    for (const r of rules) {
      const t = RULE_TYPE_MAP[r.type];
      if (!t || t.kind !== 'config') continue;
      const p = r.params || {};
      if (t.configTarget === 'itemOptions') {
        itemOptions.push({ keywords: (p.keywords || []).map(String), key: p.optionKey, value: p.optionValue });
      } else if (t.configTarget === 'orderOptions') {
        orderOptions[p.optionKey] = coerce(p.optionValue);
      }
    }
    return { itemOptions, orderOptions };
  }
  function coerce(v) {
    if (v === 'true') return true; if (v === 'false') return false;
    const n = Number(v); return v !== '' && !isNaN(n) && String(v).trim() !== '' && /^[0-9.]+$/.test(String(v)) ? n : v;
  }

  function resolveItemOptions(itemOptions, item) {
    const out = {};
    for (const o of itemOptions) {
      if (!o.key) continue;
      if (!o.keywords.length || o.keywords.some(k => item.searchText.indexOf(String(k).toLowerCase()) >= 0)) {
        out[o.key] = coerce(o.value);
      }
    }
    return out;
  }

  function summarize(picks, metrics, config, ctx) {
    const names = picks.map(p => p.item.name + (Object.keys(p.options).length ? '(' + Object.keys(p.options).join('/') + ')' : ''));
    const lines = [];
    lines.push('餐次：' + (MEAL_SLOT_LABEL[ctx.mealSlot] || ctx.mealSlot) + '　人群：' + (GROUP_LABEL[ctx.personGroup] || ctx.personGroup));
    lines.push('推荐：' + names.join(' + '));
    lines.push('合计：' + Math.round(metrics.calories) + 'kcal　蛋白 ' + Math.round(metrics.protein) + 'g　钠 ' + Math.round(metrics.sodium) + 'mg　糖 ' + Math.round(metrics.sugar) + 'g　¥' + metrics.price);
    if (metrics.couponValue > 0) lines.push('可用券：省 ¥' + metrics.couponValue + '，实付约 ¥' + Math.round((metrics.price - metrics.couponValue) * 100) / 100);
    const oo = config.orderOptions || {};
    if (Object.keys(oo).length) lines.push('订单设置：' + Object.keys(oo).map(k => k + '=' + oo[k]).join('　'));
    return lines.join('\n');
  }

  /* ------------------------------------------------------------------ *
   * 6. 导出
   * ------------------------------------------------------------------ */
  /** 注册一个新的规则类型 —— 引擎本体无需改动，这是"可扩展"的兑现方式 */
  function registerRuleType(type) {
    if (!type || !type.typeId || !type.tier || !type.kind) throw new Error('规则类型缺少 typeId / tier / kind');
    if (TIER_RANK[type.tier] == null) throw new Error('未知 tier: ' + type.tier);
    const i = RULE_TYPES.findIndex(t => t.typeId === type.typeId);
    if (i >= 0) RULE_TYPES[i] = type; else RULE_TYPES.push(type);
    RULE_TYPE_MAP[type.typeId] = type;
    return type;
  }

  return {
    TIERS, TIER_RANK, RULE_TYPES, RULE_TYPE_MAP,
    MEAL_SLOT_LABEL, GROUP_LABEL,
    recommend, normalizeItem, evaluateItemRule, inScope, registerRuleType,
    version: '1.0.0'
  };
});
/* ==== ORDER-BUTLER:END ==== */

      "type": "custom.no-category",
      "enabled": true,
      "note": "减脂期不要甜品",
      "scope": { "mealSlots": ["*"], "personGroups": ["adult"] },
      "params": { "categories": ["甜品"] }
    },
    {
      "id": "r-no-sauce",
      "type": "custom.item-option",
      "enabled": true,
      "note": "所有堡去酱，少摄入热量",
      "scope": { "mealSlots": ["*"], "personGroups": ["*"] },
      "params": { "keywords": ["堡"], "optionKey": "去酱", "optionValue": "true" }
    },
    {
      "id": "r-dinein",
      "type": "custom.order-option",
      "enabled": true,
      "note": "默认堂食",
      "scope": { "mealSlots": ["*"], "personGroups": ["*"] },
      "params": { "optionKey": "diningType", "optionValue": "堂食" }
    },
    {
      "id": "r-budget",
      "type": "value.price-cap",
      "enabled": true,
      "note": "一顿不超过 45",
      "scope": { "mealSlots": ["*"], "personGroups": ["*"] },
      "params": { "maxYuan": 45 }
    },
    {
      "id": "r-child-veto",
      "type": "person.group-veto",
      "enabled": true,
      "note": "带娃时的禁忌（只在儿童人群生效）",
      "scope": { "mealSlots": ["*"], "personGroups": ["child"] },
      "params": { "group": "child" }
    },
    {
      "id": "r-child-milk",
      "type": "person.required-category",
      "enabled": true,
      "note": "娃那一份必须带牛奶或蔬果",
      "scope": { "mealSlots": ["*"], "personGroups": ["child"] },
      "params": { "keywords": ["牛奶"] }
    },
    {
      "id": "r-child-bonus",
      "type": "person.nutrition-bonus",
      "enabled": true,
      "note": "给娃优先高钙高蛋白",
      "scope": { "mealSlots": ["*"], "personGroups": ["child"] },
      "params": { "keywords": ["钙", "牛奶", "蛋", "玉米"], "group": "child" }
    }
  ]
}
;
</script>
<script>
(function(){
'use strict';
const { RULE_TYPES, RULE_TYPE_MAP, TIERS, TIER_RANK, MEAL_SLOT_LABEL, GROUP_LABEL } = McdButler;
const TIER_COLOR = {
  safety:'#c0392b', health:'#e07b39', person:'#7a5af5',
  'meal-slot':'#2f6feb', preference:'#12a06a', custom:'#8a6d3b', value:'#c9a227'
};
const SLOT_OPTS = [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['latenight','夜宵']];
const GROUP_OPTS = [['adult','成人'],['child','儿童'],['elder','老人'],['pregnant','孕期']];
const KEY = 'mcd-butler-profile-v1';
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'r-' + Math.random().toString(36).slice(2,8);

let state = { profile: clone(window.__PROFILE__ || {rules:[]}), editing: null, result: null };
try { const s = localStorage.getItem(KEY); if (s) state.profile = JSON.parse(s); } catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state.profile)); }catch(e){} };

const $ = id => document.getElementById(id);
const tierOf = r => (RULE_TYPE_MAP[r.type]||{}).tier || 'custom';

/* ---------- 分层图例 ---------- */
$('ladder').innerHTML = TIERS.slice().sort((a,b)=>b.rank-a.rank).map(t =>
  `<div class="lv"><span class="rank" style="background:${TIER_COLOR[t.id]}">${t.rank}</span>
   <span class="nm">${esc(t.label)}</span><span class="ds">${esc(t.desc)}</span></div>`).join('');

/* ---------- 新增类型下拉 ---------- */
$('newType').innerHTML = TIERS.slice().sort((a,b)=>b.rank-a.rank).map(t => {
  const list = RULE_TYPES.filter(x => x.tier === t.id);
  if (!list.length) return '';
  return `<optgroup label="${esc(t.label)}">` +
    list.map(x => `<option value="${esc(x.typeId)}">${esc(x.label)}</option>`).join('') + `</optgroup>`;
}).join('');

/* ---------- 参数预览 ---------- */
function paramPreview(r){
  const t = RULE_TYPE_MAP[r.type]; if(!t) return '';
  const p = r.params || {};
  return (t.paramsSchema||[]).map(f => {
    let v = p[f.key];
    if (f.type === 'select') {
      const o = (f.options||[]).find(o => String(o.value) === String(v));
      v = o ? o.label : v;
    }
    if (Array.isArray(v)) v = v.join('、');
    if (v === '' || v == null) return '';
    return `<span style="margin-right:10px"><b>${esc(f.label)}</b> ${esc(v)}${f.unit?esc(f.unit):''}</span>`;
  }).filter(Boolean).join('') || '<b>（无参数）</b>';
}
function scopeText(r){
  const s = r.scope || {};
  const f = (arr, map) => (!arr || !arr.length || arr.includes('*')) ? '全部' :
    arr.map(x => map[x] || x).join('/');
  return `餐次 ${f(s.mealSlots, MEAL_SLOT_LABEL)} · 人群 ${f(s.personGroups, GROUP_LABEL)}`;
}

/* ---------- 渲染规则列表 ---------- */
function renderRules(){
  const rules = state.profile.rules || (state.profile.rules = []);
  if (!rules.length) { $('rules').innerHTML = '<div class="empty">还没有规则，右上角选一个类型新增 ↓</div>'; return; }
  const groups = TIERS.slice().sort((a,b)=>b.rank-a.rank).map(t => {
    const list = rules.filter(r => tierOf(r) === t.id);
    if (!list.length) return '';
    return `<div class="tiergroup">
      <div class="tg-hd"><span class="bar" style="background:${TIER_COLOR[t.id]}"></span>${esc(t.label)} · ${list.length}</div>
      ${list.map(ruleCard).join('')}</div>`;
  }).join('');
  $('rules').innerHTML = groups;
}

function ruleCard(r){
  const t = RULE_TYPE_MAP[r.type] || {label:r.type, icon:'?', tier:'custom'};
  const off = r.enabled === false;
  return `<div class="rule ${off?'off':''}" style="border-left-color:${TIER_COLOR[t.tier]}" data-id="${esc(r.id)}">
    <div class="ic" style="background:${TIER_COLOR[t.tier]}">${esc(t.icon||'?')}</div>
    <div class="main">
      <div class="ttl">${esc(t.label)} <span class="chip">${esc((TIERS.find(x=>x.id===t.tier)||{}).label||t.tier)}</span>
        ${off?'<span class="chip">已停用</span>':''}</div>
      ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
      <div class="pv">${paramPreview(r)}</div>
      <div class="note" style="margin-top:4px">作用域：${esc(scopeText(r))}</div>
    </div>
    <div class="acts">
      <button class="mini" data-act="toggle">${off?'启用':'停用'}</button>
      <button class="mini" data-act="edit">编辑</button>
      <button class="mini" data-act="del">删</button>
    </div>
  </div>`;
}

/* ---------- 编辑表单 ---------- */
function renderForm(id){
  const r = (state.profile.rules||[]).find(x => x.id === id);
  if (!r) { state.editing = null; renderRules(); return; }
  const t = RULE_TYPE_MAP[r.type];
  const fields = (t.paramsSchema||[]).map(f => {
    const v = (r.params||{})[f.key];
    let input;
    if (f.type === 'select') {
      input = `<select data-k="${esc(f.key)}">` + (f.options||[]).map(o =>
        `<option value="${esc(o.value)}" ${String(o.value)===String(v==null?f.default:v)?'selected':''}>${esc(o.label)}</option>`).join('') + `</select>`;
    } else if (f.type === 'number') {
      input = `<input type="number" data-k="${esc(f.key)}" value="${esc(v==null?(f.default==null?0:f.default):v)}">`;
    } else {
      const val = Array.isArray(v) ? v.join('、') : (v==null?'':v);
      input = `<input type="text" data-k="${esc(f.key)}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
    }
    return `<div class="row"><label>${esc(f.label)}${f.unit?`（${esc(f.unit)}）`:''}</label>${input}</div>`;
  }).join('');

  const chk = (name, opts, cur) => opts.map(([v,l]) =>
    `<label class="${(!cur||!cur.length||cur.includes('*')||cur.includes(v))?'on':''}">
      <input type="checkbox" data-scope="${name}" value="${v}" ${(!cur||!cur.length||cur.includes('*')||cur.includes(v))?'checked':''} style="margin:0">${l}</label>`).join('');

  const form = document.createElement('div');
  form.className = 'form';
  form.innerHTML = `
    <div style="font-weight:650;font-size:13px;margin-bottom:2px">${esc(t.label)}</div>
    <div class="hint">${esc(t.hint||'')}</div>
    <div class="row"><label>备注（给自己看的说明）</label>
      <input type="text" data-k="__note" value="${esc(r.note||'')}" placeholder="例：胃不好，最多微辣"></div>
    ${fields}
    <div class="row"><label>作用域</label>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:5px">餐次</div>
      <div class="checks">${chk('mealSlots', SLOT_OPTS, (r.scope||{}).mealSlots)}</div>
      <div style="font-size:11.5px;color:var(--muted);margin:7px 0 5px">人群</div>
      <div class="checks">${chk('personGroups', GROUP_OPTS, (r.scope||{}).personGroups)}</div>
    </div>
    <div class="btns">
      <button class="primary mini" data-act="save">保存</button>
      <button class="mini" data-act="cancel">取消</button>
    </div>`;
  renderRules();
  const escId = s => (typeof CSS !== 'undefined' && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
  const host = document.querySelector(`.rule[data-id="${escId(id)}"]`);
  if (host) host.parentNode.insertBefore(form, host.nextSibling);
  form.querySelector('input,select').focus();
}

/* ---------- 收集表单 ---------- */
function collectForm(form, r){
  const t = RULE_TYPE_MAP[r.type];
  r.params = r.params || {};
  form.querySelectorAll('[data-k]').forEach(el => {
    const k = el.getAttribute('data-k');
    if (k === '__note') { r.note = el.value.trim(); return; }
    const f = (t.paramsSchema||[]).find(x => x.key === k);
    if (!f) return;
    let v = el.value;
    if (f.type === 'number') v = Number(v);
    else if (f.type === 'tags') v = v.split(/[,、，\s]+/).filter(Boolean);
    r.params[k] = v;
  });
  const pick = name => {
    const all = [...form.querySelectorAll(`[data-scope="${name}"]`)];
    const on = all.filter(x => x.checked).map(x => x.value);
    return (on.length === 0 || on.length === all.length) ? ['*'] : on;
  };
  r.scope = { mealSlots: pick('mealSlots'), personGroups: pick('personGroups') };
}

/* ---------- 结果渲染 ---------- */
function run(){
  const ctx = { mealSlot: $('slot').value, personGroup: $('group').value, coupons: [] };
  $('ctxTag').textContent = `${MEAL_SLOT_LABEL[ctx.mealSlot]} · ${GROUP_LABEL[ctx.personGroup]}`;
  const res = McdButler.recommend({ profile: state.profile, menu: window.__MENU__, ctx, topN: 3 });
  state.result = res;
  $('out').innerHTML = renderResult(res, ctx);
}

function renderResult(res, ctx){
  if (!res.ok) {
    return `<div class="note-box">⚠️ ${esc(res.reason)}</div>
      <div class="foot">解决思路：放宽某条硬约束（如热量预算），或新增一条允许的规则。</div>`;
  }
  const m = res.metrics;

  const pickHtml = p => {
    const opt = Object.keys(p.options||{});
    const why = p.trace.length ? p.trace.map(t =>
      `<div class="trace ${t.effect==='bonus'||t.effect==='penalty'?'':'plain'}">
        <span class="tag ${t.effect==='bonus'?'plus':(t.effect==='penalty'?'minus':'')}">${t.effect==='bonus'?'+'+t.weight:(t.effect==='penalty'?t.weight:'记')}</span>
        <span><b style="color:#334155">${esc(t.label)}</b> —— ${esc(t.reason)}</span></div>`).join('')
      : '<div class="trace plain"><span class="tag">—</span><span>无规则命中，按标准份量与价格推荐</span></div>';
    return `<div class="pick">
      <div class="nm">${esc(p.item.name)}
        ${opt.length?`<span class="optag">${opt.map(o=>esc(o)).join(' · ')}</span>`:''}
        <span style="font-weight:400;color:var(--muted);font-size:12px"> ¥${esc(p.item.price)} · ${esc(p.item.calories)}kcal</span></div>
      <div class="why">${why}</div></div>`;
  };

  // 给几个选项，不是一个答案
  const opts = (res.options && res.options.length ? res.options : [{picks:res.picks, summary:res.summary}]);
  const optionsHtml = opts.map((o, i) => {
    const lines = String(o.summary||'').split('\n');
    return `<div class="opt">
      <div class="oh"><span class="idx">${i+1}</span><span>${esc((lines[1]||'').replace(/^推荐：/,''))}</span></div>
      <div class="om">${esc(lines[2]||'')}</div>
      ${o.picks.map(pickHtml).join('')}</div>`;
  }).join('');

  const bundle = (res.bundleTrace||[]).filter(t=>t.effect!=='pass').length || (res.bundleTrace||[]).length
    ? `<div style="margin:12px 0 6px;font-size:12.5px;font-weight:650;color:var(--muted)">整餐约束核对</div>` +
      (res.bundleTrace||[]).map(t =>
        `<div class="trace plain"><span class="tag" style="background:${t.effect==='pass'?'#94a3b8':'#c0392b'}">${t.effect==='pass'?'通过':'拦截'}</span>
        <span><b>${esc(t.label)}</b> —— ${esc(t.reason)}</span></div>`).join('')
    : '';

  const rej = res.rejected.length ? `<div style="margin:14px 0 6px;font-size:12.5px;font-weight:650;color:var(--muted)">
      被排除（${res.rejected.length}）</div>` + res.rejected.slice(0,12).map(x =>
      `<div class="rej"><div class="nm">${esc(x.item.name)}
        <span style="font-weight:400;color:var(--muted);font-size:11.5px">¥${esc(x.item.price)} · ${esc(x.item.calories)}kcal</span></div>
        <div class="rs">${esc(x.reason)}</div>
        ${(x.suppressed&&x.suppressed.length)?`<div class="sup">⚔ 这条否决压掉了你的偏好：<b>${x.suppressed.map(s=>esc(s.label)).join('、')}</b>（分层优先级 ${TIER_RANK[x.tier]} &gt; ${TIER_RANK[x.suppressed[0].tier]}）</div>`:''}
      </div>`).join('') : '';

  const oo = res.config.orderOptions || {};
  const cfg = Object.keys(oo).length ? `<div style="margin:14px 0 6px;font-size:12.5px;font-weight:650;color:var(--muted)">订单固定设置</div>
      <div class="kv">${Object.keys(oo).map(k=>`<span>${esc(k)} = ${esc(oo[k])}</span>`).join('')}</div>` : '';

  return `<div class="note-box ok">${esc(res.summary).replace(/\n/g,'<br>')}</div>
    <div style="font-size:12.5px;font-weight:650;color:var(--muted);margin:14px 0 7px">
      符合你规则的 ${opts.length} 个选项（主食互不重复，选哪个你定）</div>
    ${optionsHtml}${bundle}${cfg}${rej}`;
}

/* ---------- 事件 ---------- */
$('run').onclick = run;
$('add').onclick = () => {
  const typeId = $('newType').value;
  const t = RULE_TYPE_MAP[typeId]; if (!t) return;
  const r = { id: uid(), type: typeId, enabled: true, note: '', params: {}, scope: { mealSlots:['*'], personGroups:['*'] } };
  (t.paramsSchema||[]).forEach(f => { if (f.default != null) r.params[f.key] = f.default; });
  (state.profile.rules = state.profile.rules || []).push(r);
  save(); state.editing = r.id; renderForm(r.id);
};
$('rules').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.closest('.rule').getAttribute('data-id');
  const r = state.profile.rules.find(x => x.id === id); if (!r) return;
  const act = btn.getAttribute('data-act');
  if (act === 'toggle') { r.enabled = r.enabled === false; save(); renderRules(); }
  else if (act === 'del') { state.profile.rules = state.profile.rules.filter(x => x.id !== id); save(); renderRules(); }
  else if (act === 'edit') { state.editing = id; renderForm(id); }
});
document.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || !btn.closest('.form')) return;
  const act = btn.getAttribute('data-act');
  const form = btn.closest('.form');
  const r = state.profile.rules.find(x => x.id === state.editing);
  if (act === 'save' && r) { collectForm(form, r); save(); }
  state.editing = null; renderRules();
});
$('exp').onclick = () => {
  const blob = new Blob([JSON.stringify(state.profile, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'mcd-butler-profile.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { state.profile = JSON.parse(rd.result); save(); renderRules(); } catch(err){ alert('JSON 解析失败'); } };
  rd.readAsText(f); e.target.value = '';
};
$('demo').onclick = () => { state.profile = clone(window.__PROFILE__); save(); renderRules(); run(); };
$('clr').onclick = () => { if(confirm('清空所有规则？')){ state.profile = {rules:[]}; save(); renderRules(); } };
$('raw').value = JSON.stringify(state.profile, null, 2);
$('applyRaw').onclick = () => {
  try { state.profile = JSON.parse($('raw').value); save(); renderRules(); run(); }
  catch(e){ alert('JSON 解析失败：' + e.message); }
};
$('slot').onchange = $('group').onchange = () => { if (state.result) run(); };

renderRules();
run();
})();
</script>
</body>
</html>
